<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edmilson - Portfólio de Projetos</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif;scroll-behavior:smooth;}
    
    body{color:#1a1a1a; overflow-x:hidden;}

    /* VIDEO DE FUNDO MAR REAL */
    #video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* cobre a tela toda */
        z-index: -2;
    }
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(135, 206, 235, 0.2); /* azul claro por cima */
        z-index: -1;
    }

    header{
        text-align: center;
        padding: 80px 20px 40px 20px;
        background: linear-gradient(to bottom, rgba(255,255,255,0.85), transparent);
    }
    header h1{
        font-size: 3rem;
        color: #004a99;
        text-shadow: 0 2px 15px rgba(255,255,255,1);
    }
    header p{
        font-size: 1.2rem;
        color: #222;
        font-weight: 600;
    }

    .sobre, .projetos, .contato{
        max-width: 1100px;
        margin: 60px auto;
        padding: 40px 20px;
        text-align: center;
        background: rgba(255,255,255,0.85);
        border-radius: 20px;
        backdrop-filter: blur(12px);
    }
    .grid-projetos{
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
        margin-top: 30px;
    }
    .card-projeto{
        background: rgba(255,255,255,0.9);
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 8px 25px rgba(0,74,153,0.2);
    }
    .btn-projeto{
        display: inline-block;
        padding: 12px 25px;
        background: #007BFF;
        color: #fff;
        text-decoration: none;
        border-radius: 30px;
        font-weight: bold;
        margin-top: 10px;
    }
</style>
</head>
<body>

<!-- VIDEO DE FUNDO MAR - AGORA LOCAL -->
<video autoplay muted loop playsinline id="video-bg">
    <source src="mar.mp4" type="video/mp4">
    Seu navegador não suporta vídeo.
</video>
<div class="overlay"></div>

<header>
    <h1>Edmilson</h1>
    <p>Desenvolvedor de Projetos Digitais</p>
</header>

<section class="sobre">
    <h2>Sobre Mim</h2>
    <p>Eu crio sites e soluções digitais que vendem de verdade.</p>
</section>

<section class="projetos">
    <h2>Meus Projetos</h2>
    <div class="grid-projetos">
        <div class="card-projeto">
            <h3>PH Imports</h3>
            <p>Loja de iPhones com garantia.</p>
            <a href="#" class="btn-projeto">Ver Projeto</a>
        </div>
    </div>
</section>

<footer style="text-align:center; padding:20px; background: rgba(0,74,153,0.15); color: #004a99;">
    <p>© 2026 Edmilson</p>
</footer>

</body>
</html>
